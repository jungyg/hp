name: Build Hi Proof whiskey catalog

on:
  schedule:
    # Hourly runs are triggered by cron-job.org calling the workflow_dispatch
    # API, because GitHub's schedule is best-effort and often late. This is
    # only a backup in case that service stops.
    - cron: "47 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# Queue rather than cancel: a run cancelled between deploy and notify would
# lose its alerts, since the next run diffs against the already-deployed data.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch feed and build data.json
        run: python build_site.py

      # Fail loudly rather than publishing an empty catalog if the feed breaks.
      - name: Check the build produced something
        run: |
          COUNT=$(python -c "import json;print(len(json.load(open('docs/data.json'))['items']))")
          echo "$COUNT items"
          [ "$COUNT" -gt 0 ] || { echo "Empty catalog, refusing to deploy"; exit 1; }

      - name: Report classifier coverage
        run: python build_site.py --audit || true

      # Compare against the site as deployed right now, before this run replaces it.
      - name: Find whiskey new since the last deploy
        run: python notify.py diff --out new.json

      - uses: actions/upload-artifact@v4
        with:
          name: new-whiskey
          path: new.json
          retention-days: 1

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # After deploy, so a failed deploy announces nothing; the next run still
  # diffs against the old site and picks those bottles up.
  notify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: new-whiskey
      - name: Announce new whiskey (ntfy, Discord)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python3 notify.py send new.json
