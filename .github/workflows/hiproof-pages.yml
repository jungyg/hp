name: Build Hi Proof whiskey catalog

on:
  schedule:
    - cron: "0 14 * * *"     # 14:00 UTC daily
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch feed and build data.json
        run: python build_site.py

      # Fail loudly rather than publishing an empty catalog if the feed breaks.
      - name: Check the build produced something
        run: |
          COUNT=$(python -c "import json;print(len(json.load(open('docs/data.json'))['items']))")
          echo "$COUNT items"
          [ "$COUNT" -gt 0 ] || { echo "Empty catalog, refusing to deploy"; exit 1; }

      - name: Report classifier coverage
        run: python build_site.py --audit || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
